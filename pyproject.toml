[project]
name = "alfred-tts-workflow"
version = "0.2.0"
description = "Multi-provider TTS workflow for Alfred 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.0",
    "edge-tts>=7.3.1",
    "google-genai>=2.30.1",
]

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx>=0.4.0",
    "misaki[zh]>=0.8.0",
    "soundfile>=0.13.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[project.scripts]
alfred-tts = "alfred_tts.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
